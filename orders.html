<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Plant Order - Shri Ram Nursery</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#f4f7f3; font-family:Arial, sans-serif; color:#202520; }
    header { background:white; padding:12px 20px; border-bottom:1px solid #e2e7e2; display:flex; justify-content:space-between; align-items:center; }
    .logo { font-weight:bold; color:#1b5e20; text-decoration:none; }
    .container { max-width:700px; margin:20px auto; padding:0 20px; }
    .card { background:white; padding:20px; border-radius:12px; border:1px solid #e2e7e2; box-shadow:0 3px 8px rgba(0,0,0,0.03); margin-bottom:20px; }
    h2, h3 { color:#1b5e20; margin-top:0; }
    .form-group { margin-bottom:15px; }
    label { display:block; font-weight:bold; margin-bottom:5px; font-size:14px; color:#1b5e20; }
    input, select, textarea { width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:14px; background:#fff; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .col { flex:1; min-width:180px; }
    .btn-add { background:#2e7d32; color:white; border:0; padding:10px 15px; font-weight:bold; border-radius:8px; cursor:pointer; width:100%; margin-top:5px; }
    .btn-add:hover { background:#1b5e20; }
    .order-list { margin-top:15px; border-top:1px solid #eee; padding-top:10px; }
    .order-item { display:flex; justify-content:space-between; align-items:center; background:#f9fbf9; padding:8px 12px; border-radius:6px; margin-bottom:6px; font-size:14px; border:1px solid #e2e7e2; }
    .btn-del-item { background:#ffebee; color:#c62828; border:0; padding:4px 8px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:12px; }
    .btn-group { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
    .btn-wa-self { background:#007bff; color:white; border:0; padding:12px; font-weight:bold; border-radius:8px; cursor:pointer; flex:1; text-align:center; text-decoration:none; display:block; font-size:14px; }
    .btn-wa-nursery { background:#25d366; color:white; border:0; padding:12px; font-weight:bold; border-radius:8px; cursor:pointer; flex:1; text-align:center; text-decoration:none; display:block; font-size:14px; }
    .btn-wa-self:hover { background:#0056b3; }
    .btn-wa-nursery:hover { background:#1ebe5d; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">🌱 Shri Ram Nursery</a>
    <select id="global-lang" style="padding:5px; border-radius:5px;">
      <option value="hi">हिंदी</option>
      <option value="en">English</option>
      <option value="pa">ਪੰਜਾਬੀ</option>
    </select>
  </header>

  <main class="container">
    <div class="card">
      <h2>🛒 स्मार्ट डिजिटल आर्डर फॉर्म</h2>
      <p style="font-size:13px; color:#666;">अपनी जानकारी भरें, कैटेगरी और पौधे चुनकर अपनी लिस्ट बनाएं और WhatsApp पर शेयर करें।</p>
      
      <div class="form-group">
        <label>ग्राहक का नाम (Customer Name)</label>
        <input type="text" id="cust-name" placeholder="अपना पूरा नाम लिखें" required>
      </div>

      <div class="form-group">
        <label>मोबाइल नंबर (Phone Number)</label>
        <input type="tel" id="cust-phone" placeholder="WhatsApp नंबर लिखें" required>
      </div>

      <div class="form-group">
        <label>पता / गाँव / शहर (Address)</label>
        <textarea id="cust-address" placeholder="गाँव भुना, फतेहाबाद या नजदीकी पता..." style="height:50px;" required></textarea>
      </div>
    </div>

    <div class="card">
      <h3>🌿 पौधे चुनें और जोड़ें</h3>
      
      <div class="row">
        <div class="col form-group">
          <label>कैटेगरी चुनें (Category)</label>
          <select id="select-category">
            <option value="">-- कैटेगरी चुनें --</option>
            <option value="Fruit">🍎 फलदार पौधे</option>
            <option value="Indoor">🪴 इंडोर प्लांट्स</option>
            <option value="Outdoor">🌳 आउटडोर प्लांट्स</option>
            <option value="Flowering">🌺 फूलों के पौधे</option>
            <option value="Decorative">🌿 डेकोरेटिव</option>
            <option value="Landscaping">🌴 लैंडस्केपिंग</option>
            <option value="Medicinal">🌱 औषधीय</option>
          </select>
        </div>

        <div class="col form-group">
          <label>पौधा चुनें (Plant Name)</label>
          <select id="select-plant">
            <option value="">-- पहले कैटेगरी चुनें --</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>मात्रा (Quantity)</label>
        <input type="number" id="plant-qty" value="1" min="1" style="width:120px;">
      </div>

      <button type="button" id="btn-add-cart" class="btn-add">➕ इस पौधे को लिस्ट में जोड़ें</button>

      <div class="order-list">
        <h4>📋 आपकी आर्डर लिस्ट:</h4>
        <div id="cart-items-container" style="color:#777; font-size:13px; font-style:italic;">अभी कोई पौधा नहीं जोड़ा गया है।</div>
      </div>

      <div class="btn-group">
        <a href="javascript:void(0)" id="btn-send-self" class="btn-wa-self">📱 अपने WhatsApp पर भेजें</a>
        <a href="javascript:void(0)" id="btn-send-nursery" class="btn-wa-nursery">🟢 नर्सरी WhatsApp पर भेजें</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { getPlants, getCurrentLang, setLang } from "./js/plants.js";

    const langSelect = document.getElementById("global-lang");
    langSelect.value = getCurrentLang();
    langSelect.addEventListener("change", (e) => {
      setLang(e.target.value);
      location.reload();
    });

    const catSelect = document.getElementById("select-category");
    const plantSelect = document.getElementById("select-plant");
    const qtyInput = document.getElementById("plant-qty");
    const addBtn = document.getElementById("btn-add-cart");
    const cartContainer = document.getElementById("cart-items-container");

    let cart = [];

    // जब कैटेगरी बदली जाए, तो उस कैटेगरी के पौधे दूसरे ड्रॉपडाउन में आने चाहिए
    catSelect.addEventListener("change", () => {
      const selectedCat = catSelect.value;
      plantSelect.innerHTML = `<option value="">-- पौधा चुनें --</option>`;
      
      if (!selectedCat) return;

      const allPlants = getPlants();
      const filtered = allPlants.filter(p => p.category === selectedCat);

      if (filtered.length === 0) {
        // अगर उस कैटेगरी में कोई पौधा लोकल स्टोरेज में नहीं है, तो कुछ डिफॉल्ट या नाम दिखाने के लिए
        plantSelect.innerHTML += `<option value="Standard Plant">सामान्य ${catSelect.options[catSelect.selectedIndex].text}</option>`;
      } else {
        filtered.forEach(p => {
          const opt = document.createElement("option");
          opt.value = p.name + (p.variety ? ` (${p.variety})` : '');
          opt.textContent = p.name + (p.variety ? ` - ${p.variety}` : '');
          plantSelect.appendChild(opt);
        });
      }
    });

    // कार्ट में जोड़ें
    addBtn.addEventListener("click", () => {
      const catText = catSelect.options[catSelect.selectedIndex]?.text || '';
      const plantName = plantSelect.value;
      const qty = parseInt(qtyInput.value) || 1;

      if (!catSelect.value || !plantName) {
        alert("कृपया पहले कैटेगरी और पौधा दोनों चुनें!");
        return;
      }

      cart.push({ category: catText, name: plantName, qty: qty });
      renderCart();
      
      // रीसेट करें पौधे का सेलेक्शन
      plantSelect.value = "";
      qtyInput.value = "1";
    });

    // कार्ट रेंडर करना
    function renderCart() {
      if (cart.length === 0) {
        cartContainer.innerHTML = `<div style="color:#777; font-style:italic;">अभी कोई पौधा नहीं जोड़ा गया है।</div>`;
        return;
      }

      cartContainer.innerHTML = "";
      cart.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "order-item";
        div.innerHTML = `
          <span><b>${index + 1}.</b> ${item.name} <small>(${item.category})</small> - <b>मात्रा: ${item.qty}</b></span>
          <button class="btn-del-item" data-index="${index}">हटाएं</button>
        `;
        cartContainer.appendChild(div);
      });
    }

    // आइटम हटाना
    cartContainer.addEventListener("click", (e) => {
      if (e.target.classList.contains("btn-del-item")) {
        const idx = e.target.getAttribute("data-index");
        cart.splice(idx, 1);
        renderCart();
      }
    });

    // मैसेज जनरेट करने का फंक्शन
    function buildOrderMessage() {
      const name = document.getElementById("cust-name").value.trim();
      const phone = document.getElementById("cust-phone").value.trim();
      const address = document.getElementById("cust-address").value.trim();

      if (!name || !phone || !address) {
        alert("कृपया ऊपर ग्राहक का नाम, फोन नंबर और पता जरूर भरें!");
        return null;
      }

      if (cart.length === 0) {
        alert("कृपया कम से कम एक पौधा लिस्ट में जोड़ें!");
        return null;
      }

      let plantListStr = "";
      cart.forEach((item, i) => {
        plantListStr += `${i + 1}. ${item.name} (${item.category}) - मात्रा: ${item.qty}\n`;
      });

      const msg = `नमस्ते श्री राम नर्सरी (भुना)! 🌿\n\nमुझे निम्नलिखित पौधों का आर्डर देना है:\n\n👤 नाम: ${name}\n📞 मोबाइल: ${phone}\n📍 पता: ${address}\n\n🌱 पौधों की लिस्ट:\n${plantListStr}\nकृपया आर्डर कन्फर्म करें। धन्यवाद!`;
      return encodeURIComponent(msg);
    }

    // 1. अपने खुद के WhatsApp पर शेयर करना (Self WhatsApp)
    document.getElementById("btn-send-self").addEventListener("click", () => {
      const encodedMsg = buildOrderMessage();
      if (!encodedMsg) return;
      // यहाँ नंबर खाली छोड़ने पर WhatsApp खुद का चैट या खुद को भेजने का विकल्प देता है
      window.open(`https://wa.me/?text=${encodedMsg}`, "_blank");
    });

    // 2. नर्सरी के WhatsApp पर भेजना (Nursery Official WhatsApp)
    document.getElementById("btn-send-nursery").addEventListener("click", () => {
      const encodedMsg = buildOrderMessage();
      if (!encodedMsg) return;
      // श्री राम नर्सरी का आधिकारिक नंबर (9416316534)
      window.open(`https://wa.me/919416316534?text=${encodedMsg}`, "_blank");
    });
  </script>
</body>
</html>
