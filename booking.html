<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2E7D32">
    <title>Shri Ram Nursery - Plant Booking</title>
    <!-- स्टैंडर्ड और फ्रेश स्टाइलिंग -->
    <link rel="stylesheet" href="/css/style.css" onerror="this.onerror=null;this.href='./css/style.css';">
    <style>
      .booking-container { max-width: 600px; margin: 40px auto; padding: 20px; font-family: sans-serif; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
      .form-group { margin-bottom: 20px; }
      .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
      .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
      .btn-submit { background: #2E7D32; color: white; padding: 12px 20px; border: none; cursor: pointer; border-radius: 4px; font-size: 16px; width: 100%; font-weight: bold; }
      .btn-submit:hover { background: #1b5e20; }
      .action-row { display: flex; gap: 15px; margin-top: 25px; justify-content: center; }
      .button-primary { background: #0288d1; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; }
      .button-whatsapp { background: #25d366; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; }
    </style>
  </head>
  <body>

    <header class="site-header">
      <a class="brand" href="./index.html">Shri Ram Nursery <span>Bhuna</span></a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="./index.html">Home</a>
        <a href="./dashboard.html">Plants</a>
        <a href="./booking.html" style="font-weight: bold; color: #2E7D32;">Booking</a>
        <a href="./orders.html">Orders</a>
      </nav>
    </header>

    <main class="booking-container">
      <section class="page-heading" style="text-align: center; margin-bottom: 30px;">
        <p class="eyebrow" style="color: #2E7D32; font-weight: bold; margin: 0;">Online Booking Enquiry</p>
        <h1 style="margin-top: 5px;">Book Your Plants</h1>
        <p class="lead">Fill out this quick form to reserve plants or ask the Bhuna nursery team for immediate availability.</p>
      </section>

      <!-- असली वर्किंग ऑनलाइन बुकिंग फॉर्म -->
      <form id="online-booking-form">
        <div class="form-group">
          <label for="customer-name">Your Name (आपका नाम):</label>
          <input type="text" id="customer-name" required placeholder="Enter full name">
        </div>

        <div class="form-group">
          <label for="customer-phone">Mobile Number (मोबाइल नंबर):</label>
          <input type="tel" id="customer-phone" required pattern="[0-9]{10}" placeholder="Enter 10-digit number">
        </div>

        <div class="form-group">
          <label for="plant-select">Select Plant Category (पौधे की वैरायटी):</label>
          <select id="plant-select" required>
            <option value="">-- Choose Category --</option>
            <option value="Indoor Plants">Indoor Plants (घर के अंदर वाले पौधे)</option>
            <option value="Fruit Plants">Fruit Plants (फलदार पौधे - नींबू, अमरूद आदि)</option>
            <option value="Decorative Plants">Decorative Plants (सजावटी पौधे)</option>
            <option value="Flowering Plants">Flowering Plants (फूल वाले पौधे)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="booking-details">Requirements & Quantity (पौधों के नाम और गिनती):</label>
          <textarea id="booking-details" rows="4" required placeholder="e.g., 2 Snake Plants, 1 Guava Hissar Safeda..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit Booking Request ✅</button>
      </form>

      <!-- डायरेक्ट क्विक कांटेक्ट लिंक्स -->
      <div class="action-row">
        <a class="button-primary" href="tel:+919416316534">📞 Call Now</a>
        <a class="button-whatsapp" id="whatsapp-direct-link" href="#" target="_blank">💬 WhatsApp</a>
      </div>
    </main>

    <footer class="site-footer" style="text-align: center; padding: 20px; background: #2E7D32; color: white; margin-top: 40px;">
      Shri Ram Nursery, Bhuna
    </footer>

    <!-- डेटा को प्रोसेस करने की लाइव जावास्क्रिप्ट स्क्रिप्ट -->
    <script type="module">
      const bookingForm = document.getElementById('online-booking-form');
      const whatsappLink = document.getElementById('whatsapp-direct-link');

      // डिफ़ॉल्ट व्हाट्सऐप मैसेज सेट करना
      const defaultText = encodeURIComponent("Hello Shri Ram Nursery Bhuna, I want to enquire about plants.");
      whatsappLink.href = `https://wa.me{defaultText}`;

      if (bookingForm) {
        bookingForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          const name = document.getElementById('customer-name').value;
          const phone = document.getElementById('customer-phone').value;
          const category = document.getElementById('plant-select').value;
          const details = document.getElementById('booking-details').value;

          const orderPayload = {
            id: "ORDER-" + Date.now(),
            customerName: name,
            customerPhone: phone,
            plantCategory: category,
            requirements: details,
            status: "Pending",
            date: new Date().toLocaleDateString('en-IN')
          };

          try {
            // ऑर्डर्स को लोकल स्टोरेज में सुरक्षित करना ताकि 'orders.html' में दिखाई दे सकें
            let existingOrders = JSON.parse(localStorage.getItem('shri-ram-nursery-orders')) || [];
            if (!Array.isArray(existingOrders)) existingOrders = [];
            
            existingOrders.push(orderPayload);
            localStorage.setItem('shri-ram-nursery-orders', JSON.stringify(existingOrders));

            // व्हाट्सएप पर सीधे रीयल-टाइम नोटिफिकेशन भेजने के लिए यूआरएल तैयार करें
            const textMessage = `*New Booking Request - Shri Ram Nursery*\n\n👤 *Name:* ${name}\n📞 *Phone:* ${phone}\n🌿 *Category:* ${category}\n📝 *Details:* ${details}`;
            const secureWhatsAppURL = `https://wa.me{encodeURIComponent(textMessage)}`;

            alert('Your booking request is successfully submitted! Clicking OK will send your details to our team via WhatsApp. ✅');
            
            bookingForm.reset();
            window.open(secureWhatsAppURL, '_blank');

          } catch (error) {
            console.error("Booking error:", error);
            alert("Something went wrong during submission. Please try again.");
          }
        });
      }
    </script>
  </body>
</html>
