<!doctype html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>श्री राम नर्सरी - स्टॉक एवं कैटलॉग मैनेजर (Admin)</title>
    
    <!-- Supabase JS Library -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f7f5; padding: 20px; }
        
        .manager-container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; border: 1px solid #e2e7e2; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #1b5e20; text-decoration: none; font-weight: 700; }
        
        h1, h2 { color: #1b5e20; margin-top: 0; font-weight: 800; }
        
        /* फॉर्म स्टाइल */
        .add-form { background: #e8f5e9; padding: 20px; border-radius: 8px; border: 1px solid #c8e6c9; margin-bottom: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; text-align: left; }
        .form-group label { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 5px; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: white; }
        .btn-submit { background: #1b5e20; color: white; border: none; padding: 11px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        
        /* डेटा टेबल स्टाइल */
        .stock-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; text-align: left; }
        .stock-table th, .stock-table td { padding: 12px; border-bottom: 1px solid #e2e7e2; }
        .stock-table th { background: #1b5e20; color: white; font-weight: 700; }
        .stock-table tr:hover { background: #f9f9f9; }
        
        .thumb-img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; background: #eee; }
        .btn-delete { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; padding: 6px 12px; border-radius: 4px; font-weight: 700; cursor: pointer; }
        .btn-delete:hover { background: #c62828; color: white; }
        
        @media (max-width: 768px) {
            .add-form { grid-template-columns: 1fr; }
            .stock-table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>

    <div class="manager-container">
        <a href="dashboard.html" class="back-link">← एडमिन डैशबोर्ड पर वापस जाएं</a>
        <h1>🌿 स्टॉक एवं कैटलॉग मैनेजर (Admin Mode)</h1>
        <p style="color: #666; margin-bottom: 30px;">यहाँ से आप ग्राहकों के कैटलॉग में दिखने वाले पौधों को लाइव कंट्रोल कर सकते हैं।</p>

        <!-- नया पौधा जोड़ने का फॉर्म -->
        <h2>➕ नया पौधा कैटलॉग में जोड़ें</h2>
        <form class="add-form" onsubmit="addNewPlant(event)">
            <div class="form-group">
                <label>🌱 पौधे का नाम</label>
                <input type="text" id="plantName" placeholder="जैसे: अमरूद, आम" required>
            </div>
            <div class="form-group">
                <label>✨ वैरायटी / किस्म</label>
                <input type="text" id="plantVariety" placeholder="जैसे: हिसार सफेदा, चौसा">
            </div>
            <div class="form-group">
                <label>📁 कैटेगरी चुनें</label>
                <select id="plantCategory" required>
                    <option value="Fruit">फलदार पौधे</option>
                    <option value="Indoor">इनडोर प्लांट</option>
                    <option value="Outdoor">आउटडोर प्लांट</option>
                    <option value="Flowering">फूलदार पौधे</option>
                    <option value="Decorative">डेकोरेटिव पौधे</option>
                    <option value="Landscaping">लैंडस्केपिंग</option>
                </select>
            </div>
            <div class="form-group">
                <label>📸 फोटो URL लिंक</label>
                <input type="url" id="plantImgUrl" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>💡 रखरखाव टिप्स</label>
                <input type="text" id="plantTips" placeholder="धूप और पानी का नियम">
            </div>
            <button type="submit" class="btn-submit">💾 स्टॉक में जोड़ें</button>
        </form>

        <!-- लाइव स्टॉक टेबल -->
        <h2>📦 वर्तमान लाइव स्टॉक की सूची</h2>
        <table class="stock-table">
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>नाम (पौधा)</th>
                    <th>वैरायटी</th>
                    <th>कैटेगरी</th>
                    <th>कार्रवाई</th>
                </tr>
            </thead>
            <tbody id="stockTableBody">
                <tr>
                    <td colspan="5" style="text-align: center; color: #666;">स्टॉक सूची लोड हो रही है...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // 🔒 अधिकृत सुपबेस कनेक्शन चाबी (हार्डकोडेड)
        const supabase = supabase.createClient("https://supabase.co", "sb_publishable_YUi1f1Q2sHxEFiYoBJ7ZUw_TzZga11K");

        // सुरक्षा जांच: सुनिश्चित करें कि लॉगिन है
        if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
            window.location.href = "admin.html";
        }

        const DEFAULT_IMG = "https://unsplash.com";

        document.addEventListener("DOMContentLoaded", () => {
            loadStockTable();
        });

        // 1. सुपबेस से स्टॉक टेबल डेटा लोड करना
        async function loadStockTable() {
            const tbody = document.getElementById('stockTableBody');
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #666;">डेटा लोड हो रहा है...</td></tr>`;

            try {
                const { data, error } = await supabase
                    .from('Plants')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;

                tbody.innerHTML = "";
                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #666;">स्टॉक में कोई पौधा उपलब्ध नहीं है।</td></tr>`;
                    return;
                }

                data.forEach(plant => {
                    const img = plant.image_url ? plant.image_url : DEFAULT_IMG;
                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${img}" class="thumb-img" onerror="this.src='${DEFAULT_IMG}'"></td>
                            <td><b>${plant.name}</b></td>
                            <td>${plant.variety || '-'}</td>
                            <td>${translateCategory(plant.category)}</td>
                            <td><button class="btn-delete" onclick="deletePlantItem(${plant.id})">❌ Delete</button></td>
                        </tr>
                    `;
                });

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">⚠️ सूची लोड करने में त्रुटि आई।</td></tr>`;
            }
        }

        // 2. नया पौधा डेटाबेस में जोड़ना
        async function addNewPlant(event) {
            event.preventDefault();

            const name = document.getElementById('plantName').value.trim();
            const variety = document.getElementById('plantVariety').value.trim();
            const category = document.getElementById('plantCategory').value;
            const imgUrl = document.getElementById('plantImgUrl').value.trim();
            const tips = document.getElementById('plantTips').value.trim();

            try {
                const { error } = await supabase
                    .from('Plants')
                    .insert([{
                        name: name,
                        variety: variety,
                        category: category,
                        image_url: imgUrl ? imgUrl : null,
                        tips: tips ? tips : null,
                        availability: "उपलब्ध"
                    }]);

                if (error) throw error;

                alert("✅ नया पौधा सफलतापूर्वक कैटलॉग में जुड़ गया है!");
                document.querySelector('.add-form').reset();
                loadStockTable(); // टेबल रिफ्रेश करें

            } catch (err) {
                alert("❌ डेटाबेस में पौधा नहीं जोड़ा जा सका।");
            }
        }

        // 3. डेटाबेस से पौधा डिलीट करना
        async function deletePlantItem(plantId) {
            if (!confirm("क्या आप वाकई इस पौधे को स्टॉक से हमेशा के लिए हटाना चाहते हैं?")) return;

            try {
                const { error } = await supabase
                    .from('Plants')
                    .delete()
                    .eq('id', parseInt(plantId));

                if (error) throw error;

                alert("🗑️ पौधा स्टॉक से सफलतापूर्वक हटा दिया गया है।");
                loadStockTable(); // टेबल रिफ्रेश करें

            } catch (err) {
                alert("❌ पौधा डिलीट करने में समस्या आई।");
            }
        }

        // कैटेगरी का हिंदी नाम अनुवाद
        function translateCategory(engCat) {
            const mapping = {
                'Fruit': 'फलदार पौधे',
                'Indoor': 'इनडोर प्लांट',
                'Outdoor': 'आउटडोर प्लांट',
                'Flowering': 'फूलदार पौधे',
                'Decorative': 'डेकोरेटिव पौधे',
                'Landscaping': 'लैंडस्केपिंग'
            };
            return mapping[engCat] || engCat;
        }
    </script>
</body>
</html>
