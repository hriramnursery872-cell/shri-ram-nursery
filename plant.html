<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E7D32">
  <title>पौधे की जानकारी - श्री राम नर्सरी</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f3;
      color: #202520;
    }
    header {
      background: white;
      border-bottom: 1px solid #e2e7e2;
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-container {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { font-weight: 800; font-size: 18px; color: #1b5e20; text-decoration: none; }
    
    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .plant-detail-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e2e7e2;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .plant-img-box {
      background: #edf3ed;
      min-height: 300px;
    }
    .plant-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .plant-content {
      padding: 30px;
      display: flex;
      flex-direction: column;
    }
    .plant-title { font-size: 26px; font-weight: 800; color: #1b5e20; margin: 0 0 5px; }
    .variety-tag { font-size: 14px; color: #666; margin-bottom: 15px; font-weight: 700; }
    .badge { display: inline-block; background: #e8f5e9; color: #1b5e20; padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: 700; margin-bottom: 20px; width: fit-content; }
    
    .care-box {
      background: #f7faf7;
      border: 1px solid #d8e6d8;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.6;
    }
    .care-box h4 { margin: 0 0 8px; color: #1b5e20; font-size: 15px; }
    
    .btn-whatsapp-order {
      background: #25d366;
      color: white;
      text-decoration: none;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      display: block;
      margin-top: auto;
    }
    .btn-whatsapp-order:hover { background: #1ebe57; }

    @media(max-width: 768px) {
      .plant-detail-card { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="dashboard.html" class="logo">← कैटलॉग पर वापस जाएं</a>
    </div>
  </header>

  <main class="container">
    <div class="plant-detail-card" id="plant-detail-box">
      <div class="plant-img-box" id="detail-img-container">
        <div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:48px;">🌱</div>
      </div>
      <div class="plant-content">
        <h1 class="plant-title" id="detail-name">पौधे का नाम</h1>
        <div class="variety-tag" id="detail-variety">Variety: --</div>
        <div><span class="badge">🟢 श्री राम नर्सरी (भुना) में उपलब्ध</span></div>
        
        <div class="care-box">
          <h4>🌱 वैज्ञानिक देखभाल एवं हॉर्टिकल्चर गाइड:</h4>
          <p id="detail-tips">नियमित रूप से मध्यम मात्रा में पानी दें और धूप वाली जगह पर रखें।</p>
        </div>

        <a href="#" id="whatsapp-order-link" class="btn-whatsapp-order" target="_blank">🟢 WhatsApp पर आर्डर बुक करें</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { getPlants } from './js/plants.js';

    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const plants = getPlants();
      
      const plant = plants[id] || plants.find(p => p.id === id) || plants[0];

      if (plant) {
        document.getElementById("detail-name").textContent = plant.name || "पौधा";
        document.getElementById("detail-variety").textContent = plant.variety ? `Variety: ${plant.variety}` : "श्री राम नर्सरी (भुना)";
        if (plant.tips) {
          document.getElementById("detail-tips").textContent = plant.tips;
        }
        
        const imgContainer = document.getElementById("detail-img-container");
        const imgUrl = plant.image || plant.imageUrl;
        if (imgUrl) {
          imgContainer.innerHTML = `<img src="${imgUrl}" alt="${plant.name}">`;
        }

        const msg = encodeURIComponent(`नमस्ते श्री राम नर्सरी (भुना)! 🙏\nमुझे यह पौधा खरीदना है:\n*${plant.name}* ${plant.variety ? `(${plant.variety})` : ''}\nकृपया इसकी उपलब्धता और कीमत की जानकारी दें।`);
        document.getElementById("whatsapp-order-link").href = `https://wa.me/919416316534?text=${msg}`;
      }
    });
  </script>
</body>
</html>
