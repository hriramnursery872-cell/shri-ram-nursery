<!doctype html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>श्री राम नर्सरी - पौधे देखें</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f7f5; color: #202520; }
        HEADER { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .logo-section { font-weight: 800; font-size: 22px; color: #1b5e20; text-decoration: none; }
        .CONTAINER { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .search-box { width: 100%; padding: 12px 15px; border: 1px solid #cccccc; border-radius: 8px; margin-bottom: 15px; font-size: 15px; }
        .plant-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .plant-card { background: white; border-radius: 12px; border: 1px solid #e2e7e2; overflow: hidden; display: flex; flex-direction: column; }
        .plant-img { width: 100%; height: 200px; object-fit: cover; background: #eaedf0; }
        .plant-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .plant-name { font-size: 18px; font-weight: 800; color: #1b5e20; margin: 0 0 5px 0; }
        .card-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: auto; }
        .act-btn { border: 1px solid #cccccc; padding: 10px 5px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; background: white; text-align: center; }
        .act-btn.liked { background: #ffebee; color: #c62828; border-color: #ffcdd2; }
    </style>
</head>
<body>
    <HEADER>
        <div class="header-container">
            <a class="logo-section" href="index.html">🌿 श्री राम नर्सरी</a>
            <div id="langSelectorDiv">
                <select id="appLangSelect" onchange="changeAppLang(this.value)" style="padding:6px; border-radius:6px; font-weight:bold;">
                    <option value="hi">हिंदी</option>
                    <option value="en">English</option>
                    <option value="pa">ਪੰਜਾਬੀ</option>
                    <option value="gu">ગુજરાતી</option>
                    <option value="mr">मराठी</option>
                    <option value="bn">বাংলা</option>
                    <option value="ta">தமிழ்</option>
                    <option value="te">తెలుగు</option>
                    <option value="kn">ಕನ್ನಡ</option>
                    <option value="ml">മലയാളം</option>
                </select>
            </div>
        </div>
    </HEADER>

    <main class="CONTAINER">
        <input type="text" id="searchBar" class="search-box" placeholder="🔍 पौधे का नाम या वैरायटी खोजें...">
        <div class="plant-grid" id="plantGrid">डेटा लोड हो रहा है...</div>
    </main>

    <script type="module">
        import { getPlants, setLang, getCurrentLang } from './js/plants.js';
        document.addEventListener('DOMContentLoaded', () => {
            const current = getCurrentLang();
            if(document.getElementById('appLangSelect')) document.getElementById('appLangSelect').value = current;
            renderGrid();
        });
        window.changeAppLang = function(lang) {
            setLang(lang);
            location.reload();
        };
        function renderGrid() {
            const grid = document.getElementById('plantGrid');
            const data = getPlants();
            grid.innerHTML = "";
            data.forEach(p => {
                grid.innerHTML += `
                    <div class="plant-card">
                        <img class="plant-img" src="${p.image}" alt="${p.name}">
                        <div class="plant-info">
                            <h3 class="plant-name">${p.name}</h3>
                            <p style="color:#666; margin:0 0 15px 0;">${p.variety || ''}</p>
                            <div class="card-actions">
                                <button class="act-btn">🤍 Like</button>
                                <button class="act-btn">📝 Details</button>
                                <button class="act-btn">🔗 Share</button>
                            </div>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
