<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E7D32">
  <title>श्री राम नर्सरी (भुना) - Admin Panel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f7f3;
      color: #202520;
      font-family: Arial, Helvetica, sans-serif;
    }
    button, input, select, textarea { font: inherit; }

    #admin-login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(rgba(20,70,25,.78), rgba(20,70,25,.78)), linear-gradient(135deg, #1b5e20, #66bb6a);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    .login-logo { text-align: center; font-size: 26px; font-weight: 800; color: #1b5e20; margin-bottom: 5px; }
    .login-subtitle { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 13px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      outline: none;
    }
    .btn { border: 0; border-radius: 8px; padding: 11px; cursor: pointer; font-weight: 700; width: 100%; }
    .btn-primary { background: #2e7d32; color: white; }
    .login-error { display: none; margin-top: 12px; padding: 10px; background: #ffebee; color: #c62828; border-radius: 6px; font-size: 13px; font-weight: 600; }

    #admin-app { display: none; }
    .admin-header {
      background: #1b5e20;
      color: white;
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner { max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
    .admin-container { max-width: 1200px; margin: auto; padding: 20px; }
    
    .section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #e2e7e2;
    }
    .section h2 { margin-top: 0; font-size: 18px; color: #1b5e20; }
    
    .table-wrapper { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; font-size: 13px; }
    th { background: #f9fbf9; color: #315b34; }
    
    .plant-img-thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; background: #eee; }
    .btn-danger { background: #ffebee; color: #c62828; border: 0; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; }
  </style>
</head>
<body>

  <!-- LOGIN PANEL -->
  <section id="admin-login">
    <div class="login-card">
      <div class="login-logo">🌿 श्री राम नर्सरी</div>
      <div class="login-subtitle">Secure Admin Portal</div>
      <div class="form-group">
        <label>📱 अधिकृत मोबाइल नंबर</label>
        <input type="tel" id="login-phone" placeholder="मोबाइल नंबर दर्ज करें" maxlength="10">
      </div>
      <div class="form-group">
        <label>🔑 Admin PIN</label>
        <input type="password" id="login-pin" placeholder="PIN दर्ज करें">
      </div>
      <button type="button" class="btn btn-primary" id="login-btn">🔐 लॉगिन करें</button>
      <div id="login-error" class="login-error"></div>
    </div>
  </section>

  <!-- ADMIN DASHBOARD -->
  <div id="admin-app">
    <header class="admin-header">
      <div class="header-inner">
        <div><strong>🌿 श्री राम नर्सरी - Admin Panel</strong></div>
        <button type="button" id="logout-btn" style="background:white; color:#1b5e20; border:0; padding:6px 12px; border-radius:6px; font-weight:700; cursor:pointer;">Logout</button>
      </div>
    </header>

    <main class="admin-container">
      <!-- ADD PLANT -->
      <section class="section">
        <h2>➕ नया पौधा जोड़ें (Catalog Manager)</h2>
        <form id="plant-form">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px;">
            <div class="form-group" style="margin:0;">
              <label>पौधे का नाम</label>
              <input type="text" id="plant-name" required placeholder="जैसे: अमरूद हिसार सफेदा">
            </div>
            <div class="form-group" style="margin:0;">
              <label>Variety</label>
              <input type="text" id="plant-variety" placeholder="जैसे: Hisar Safeda">
            </div>
          </div>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px;">
            <div class="form-group" style="margin:0;">
              <label>Category</label>
              <select id="plant-category">
                <option value="Fruit">🍊 फलदार पौधे</option>
                <option value="Indoor">🪴 इंडोर प्लांट</option>
                <option value="Outdoor">🌳 आउटडोर प्लांट</option>
                <option value="Flowering">🌸 फूलदार पौधे</option>
                <option value="Decorative">🌿 डेकोरेटिव पौधे</option>
                <option value="Other">🌱 अन्य</option>
              </select>
            </div>
            <div class="form-group" style="margin:0;">
              <label>📷 पौधे की फोटो (Image)</label>
              <input type="file" id="plant-image-file" accept="image/*">
            </div>
          </div>
          <div class="form-group">
            <label>🌱 देखभाल के टिप्स (Horticulture Tips)</label>
            <textarea id="plant-tips" rows="2" placeholder="पानी और देखभाल की जानकारी..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary">🌱 पौधा सेव करें</button>
        </form>
      </section>

      <!-- PLANT INVENTORY LIST -->
      <section class="section">
        <h2>📋 पौधे सूची और इमेज मैनेजर</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Photo</th>
                <th>Name & Variety</th>
                <th>Category</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="admin-plants-list"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { getPlants, savePlants } from './js/plants.js';

    const ADMIN_PHONE = "9416316534";
    const ADMIN_PIN = "123456";

    const loginScreen = document.getElementById("admin-login");
    const adminApp = document.getElementById("admin-app");
    
    function checkAuth() {
      // Using localStorage for multi-device persistent session until manual logout
      if (localStorage.getItem("shriRamAdminLoggedIn") === "true") {
        loginScreen.style.display = "none";
        adminApp.style.display = "block";
        loadAdminPlants();
      }
    }

    document.getElementById("login-btn").addEventListener("click", () => {
      const phone = document.getElementById("login-phone").value.trim();
      const pin = document.getElementById("login-pin").value.trim();
      const errBox = document.getElementById("login-error");

      if (phone === ADMIN_PHONE && pin === ADMIN_PIN) {
        localStorage.setItem("shriRamAdminLoggedIn", "true");
        checkAuth();
      } else {
        errBox.textContent = "❌ गलत मोबाइल नंबर या पिन!";
        errBox.style.display = "block";
      }
    });

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem("shriRamAdminLoggedIn");
      adminApp.style.display = "none";
      loginScreen.style.display = "flex";
      document.getElementById("login-phone").value = "";
      document.getElementById("login-pin").value = "";
    });

    window.addEventListener("DOMContentLoaded", checkAuth);

    // Image compression utility
    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX = 400;
          let w = img.width, h = img.height;
          if (w > h && w > MAX) { h *= MAX/w; w = MAX; }
          else if (h > MAX) { w *= MAX/h; h = MAX; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    const plantForm = document.getElementById("plant-form");
    plantForm.addEventListener("submit", e => {
      e.preventDefault();
      const name = document.getElementById("plant-name").value.trim();
      const variety = document.getElementById("plant-variety").value.trim();
      const category = document.getElementById("plant-category").value;
      const tips = document.getElementById("plant-tips").value.trim();
      const fileInput = document.getElementById("plant-image-file").files[0];

      const saveRecord = (imgData = "") => {
        const newPlant = {
          id: Date.now().toString(),
          name, variety, category, tips,
          image: imgData,
          imageUrl: imgData
        };
        const plants = getPlants();
        plants.push(newPlant);
        savePlants(plants);
        plantForm.reset();
        loadAdminPlants();
        alert("✅ पौधा सफलताપूर्वक जोड़ दिया गया है!");
      };

      if (fileInput) {
        compressImage(fileInput, saveRecord);
      } else {
        saveRecord();
      }
    });

    function loadAdminPlants() {
      const tbody = document.getElementById("admin-plants-list");
      const plants = getPlants();
      tbody.innerHTML = "";

      if (!plants || plants.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:20px; color:#666;">कोई पौधा नहीं है।</td></tr>`;
        return;
      }

      plants.forEach((plant, index) => {
        const tr = document.createElement("tr");
        const img = plant.image || plant.imageUrl || "";
        tr.innerHTML = `
          <td>${img ? `<img src="${img}" class="plant-img-thumb">` : '🌱'}</td>
          <td><strong>${plant.name}</strong><br><small>${plant.variety || ''}</small></td>
          <td>${plant.category || 'Other'}</td>
          <td><button class="btn-danger" data-index="${index}">Delete</button></td>
        `;
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll(".btn-danger").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.index);
          if (confirm("क्या आप इस पौधे को हटाना चाहते हैं?")) {
            const plants = getPlants();
            plants.splice(idx, 1);
            savePlants(plants);
            loadAdminPlants();
          }
        });
      });
    }
  </script>
</body>
</html>
