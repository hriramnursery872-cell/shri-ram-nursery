<!doctype html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>श्री राम नर्सरी - सुरक्षित एडमिन पोर्टल</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #2E7D32; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-card { background: #ffffff; border-radius: 16px; padding: 35px 25px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
        .logo-text { font-size: 24px; font-weight: 800; color: #1b5e20; margin: 0 0 5px 0; }
        .form-group { text-align: left; margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: 700; color: #333; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #cccccc; border-radius: 8px; font-size: 16px; }
        .btn-login { width: 100%; background: #1b5e20; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .error-box { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-top: 20px; display: none; text-align: left; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 class="logo-text">🌿 श्री राम नर्सरी (भुना)</h1>
        <p style="color:#555; font-weight:600; margin-bottom:20px;">सुरक्षित Admin Panel</p>
        <form onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label>📱 अधिकृत मोबाइल नंबर</label>
                <input type="tel" id="adminPhone" placeholder="9416316534" required>
            </div>
            <div class="form-group">
                <label>🔑 Admin PIN (6 अंक)</label>
                <input type="password" id="adminPin" placeholder="अपना 6-अंकी PIN दर्ज करें" required>
            </div>
            <button type="submit" class="btn-login">🔒 Admin Panel खोलें</button>
        </form>
        <div class="error-box" id="errorBox">❌ मोबाइल नंबर या PIN अधिकृत नहीं है!</div>
    </div>
    <script>
        function handleAdminLogin(event) {
            event.preventDefault();
            const phone = document.getElementById('adminPhone').value.trim();
            const pin = document.getElementById('adminPin').value.trim();
            const errorBox = document.getElementById('errorBox');
            
            if (phone === "9416316534" && pin === "941631") {
                localStorage.setItem('isAdminLoggedIn', 'true');
                window.location.href = "dashboard.html"; 
            } else {
                errorBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
