<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>श्री राम नर्सरी - सुरक्षित एडमिन पोर्टल</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2e7d32; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; width: 350px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-login { background-color: #1b5e20; color: white; border: none; width: 100%; padding: 12px; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .error-msg { color: red; margin-top: 15px; display: none; background: #ffebee; padding: 8px; border-radius: 5px; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>🌿 श्री राम नर्सरी (भुना)</h2>
    <p style="color: #555; font-size: 14px;">सुरक्षित Admin Panel</p>
    
    <form id="loginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
            <label>📱 अधिकृत मोबाइल नंबर</label>
            <input type="tel" id="adminPhone" placeholder="9416316534" required>
        </div>
        <div class="form-group">
            <label>🔑 Admin PIN (6 अंक)</label>
            <input type="password" id="adminPin" placeholder="******" maxlength="6" required>
        </div>
        <button type="submit" class="btn-login">🔒 Admin Panel खोलें</button>
    </form>
    
    <div id="errorBox" class="error-msg">❌ मोबाइल नंबर या PIN अधिकृत नहीं है!</div>
</div>

<script>
function handleAdminLogin(event) {
    event.preventDefault();
    const phone = document.getElementById("adminPhone").value.trim();
    const pin = document.getElementById("adminPin").value.trim();
    const errorBox = document.getElementById("errorBox");

    // हार्डकोडेड क्रेडेंशियल्स की जांच
    if (phone === "9416316534" && pin === "941631") {
        localStorage.setItem("isAdminLoggedIn", "true");
        errorBox.style.display = "none";
        window.location.href = "plant.html"; // सीधे प्लांट मैनेजमेंट पेज पर भेजें
    } else {
        localStorage.setItem("isAdminLoggedIn", "false");
        errorBox.style.display = "block";
    }
}
</script>
</body>
</html>
