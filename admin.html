<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>श्री राम नर्सरी - सुरक्षित एडमिन पोर्टल</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-container" style="max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: sans-serif;">
    <h2>🌿 श्री राम नर्सरी (भुना)</h2>
    <p style="color: #555; font-size: 14px;">सुरक्षित व्यवस्थापकीय पैनल</p>

    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
      <div style="margin-bottom: 15px;">
        <label>मोबाइल नंबर:</label>
        <input type="text" id="adminPhone" placeholder="9416316534" required style="width: 100%; padding: 8px; box-sizing: border-box; margin-top: 5px;">
      </div>
      <div style="margin-bottom: 15px;">
        <label>पिन (6 अंक):</label>
        <input type="password" id="adminPin" placeholder="******" required style="width: 100%; padding: 8px; box-sizing: border-box; margin-top: 5px;">
      </div>
      <button type="submit" style="background: green; color: white; padding: 10px 15px; border: none; width: 100%; font-weight: bold; cursor: pointer;">एडमिन पैनल खोलें</button>
    </form>
    <p id="errorMsg" style="color: red; margin-top: 10px; display: none;">❌ मोबाइल नंबर या पिन अमान्य है।</p>
  </div>

  <script>
    function handleAdminLogin(event) {
      event.preventDefault();
      const phone = document.getElementById('adminPhone').value.trim();
      const pin = document.getElementById('adminPin').value.trim();
      const errorBox = document.getElementById('errorMsg');

      if (phone === "9416316534" && pin === "941631") {
        localStorage.setItem("isAdminLoggedIn", "true");
        errorBox.style.display = "none";
        window.location.href = "plant.html";
      } else {
        localStorage.setItem("isAdminLoggedIn", "false");
        errorBox.style.display = "block";
      }
    }
  </script>
</body>
</html>
